<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SaaS Roadmap Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        primary: '#3b82f6',
                        secondary: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-200 transition-colors duration-300 font-sans">
    
    <div class="flex h-screen overflow-hidden relative">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity opacity-0 pointer-events-none"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white dark:bg-darkCard shadow-lg flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50">
            <div>
                <div class="h-16 flex items-center px-6 border-b dark:border-gray-700">
                    <i class="fa-solid fa-rocket text-primary text-2xl mr-3"></i>
                    <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">SaaS Roadmap</h1>
                </div>
                <nav class="p-4 space-y-2">
                    <a href="#" class="flex items-center px-4 py-3 bg-blue-50 dark:bg-blue-900/30 text-primary rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                    </a>
                    <a href="#" class="flex items-center px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-list-check w-6"></i> All Tasks
                    </a>
                    <a href="#" class="flex items-center px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-check-double w-6"></i> Completed
                    </a>
                    <a href="#" class="flex items-center px-4 py-3 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg font-medium transition-colors">
                        <i class="fa-regular fa-clock w-6"></i> Pending
                    </a>
                </nav>
            </div>
            
            <div class="p-4 border-t dark:border-gray-700 space-y-2">
                <button id="exportBtn" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <i class="fa-solid fa-download mr-2"></i> Export JSON
                </button>
                <label for="importFile" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors cursor-pointer">
                    <i class="fa-solid fa-upload mr-2"></i> Import JSON
                </label>
                <input type="file" id="importFile" class="hidden" accept=".json">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <!-- Navbar -->
            <header class="h-16 glassmorphism border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 sm:px-6 z-10 sticky top-0">
                <div class="flex items-center w-full max-w-xl relative">
                    <button id="mobileMenuBtn" class="md:hidden mr-3 text-gray-500 hover:text-primary focus:outline-none transition-colors">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="relative w-full">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="globalSearch" placeholder="Search tasks or sections..." 
                               class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-800 border-transparent focus:bg-white dark:focus:bg-darkCard rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                    </div>
                </div>
                
                <div class="flex items-center space-x-4 ml-4">
                    <div class="hidden sm:flex items-center space-x-2 mr-4">
                        <div class="w-32 bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden">
                            <div id="navProgressBar" class="bg-primary h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="navProgressText" class="text-xs font-medium text-gray-500 dark:text-gray-400">0%</span>
                    </div>
                    
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                        <i class="fa-solid fa-moon text-gray-600 dark:text-gray-300 text-lg"></i>
                    </button>
                    
                    <button id="addSectionBtnHeader" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md shadow-blue-500/30 transition-all flex items-center transform hover:scale-105">
                        <i class="fa-solid fa-plus mr-2"></i> Add Section
                    </button>
                </div>
            </header>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-6 scroll-smooth custom-scrollbar" id="mainScrollArea">
                
                <!-- Dashboard Analytics -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="analyticsDashboard">
                    <div class="bg-white dark:bg-darkCard rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between transform hover:-translate-y-1 transition-transform duration-300">
                        <div>
                            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Tasks</p>
                            <h3 class="text-2xl font-bold mt-1" id="statTotalTasks">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 rounded-full flex items-center justify-center text-primary text-xl">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-darkCard rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between transform hover:-translate-y-1 transition-transform duration-300">
                        <div>
                            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Completed</p>
                            <h3 class="text-2xl font-bold mt-1 text-green-600 dark:text-green-400" id="statCompleted">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-green-100 dark:bg-green-900/40 rounded-full flex items-center justify-center text-green-600 dark:text-green-400 text-xl">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-darkCard rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between transform hover:-translate-y-1 transition-transform duration-300">
                        <div>
                            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Pending</p>
                            <h3 class="text-2xl font-bold mt-1 text-orange-500 dark:text-orange-400" id="statPending">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-orange-100 dark:bg-orange-900/40 rounded-full flex items-center justify-center text-orange-500 dark:text-orange-400 text-xl">
                            <i class="fa-solid fa-spinner"></i>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-darkCard rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between transform hover:-translate-y-1 transition-transform duration-300">
                        <div class="w-full">
                            <div class="flex justify-between items-end mb-2">
                                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Overall Progress</p>
                                <span class="text-lg font-bold text-primary" id="statProgressText">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">
                                <div id="statProgressBar" class="bg-gradient-to-r from-primary to-secondary h-2 rounded-full transition-all duration-700" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="flex flex-wrap items-center justify-between mb-6 gap-4">
                    <div class="flex space-x-2 overflow-x-auto pb-2 custom-scrollbar">
                        <button class="filter-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-gray-800 text-white dark:bg-white dark:text-gray-800 transition-colors whitespace-nowrap" data-filter="all">All</button>
                        <button class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors whitespace-nowrap" data-filter="completed">Completed</button>
                        <button class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors whitespace-nowrap" data-filter="pending">Pending</button>
                        <button class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-darkCard border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors whitespace-nowrap text-red-500" data-filter="critical">Critical</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <label class="text-sm text-gray-500 dark:text-gray-400">Sort By:</label>
                        <select id="sortSelect" class="bg-white dark:bg-darkCard border border-gray-300 dark:border-gray-600 text-sm rounded-lg focus:ring-primary focus:border-primary block p-2 outline-none">
                            <option value="order">Custom Order</option>
                            <option value="priority">Priority</option>
                            <option value="date">Created Date</option>
                        </select>
                    </div>
                </div>

                <!-- Sections Container -->
                <div id="sectionsContainer" class="space-y-6 pb-20">
                    <!-- Sections will be injected here via JS -->
                    <div class="flex justify-center items-center py-12 text-gray-400">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                        <span class="ml-3 font-medium">Loading Roadmap...</span>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Add/Edit Section Modal -->
    <div id="sectionModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-darkCard rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <h2 id="sectionModalTitle" class="text-xl font-bold mb-4">Add Section</h2>
            <form id="sectionForm">
                <input type="hidden" id="sectionId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Section Name</label>
                    <input type="text" id="sectionNameInput" required class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" class="close-modal-btn px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-blue-600 rounded-lg shadow-md transition-colors">Save Section</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-darkCard rounded-2xl w-full max-w-lg p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <h2 id="taskModalTitle" class="text-xl font-bold mb-4">Add Task</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <input type="hidden" id="taskSectionId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Task Title</label>
                    <input type="text" id="taskTitleInput" required class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Assignee</label>
                    <input type="text" id="taskAssigneeInput" placeholder="Name (e.g. John Doe)" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Priority</label>
                    <div class="flex space-x-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="Low" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 peer-checked:bg-green-100 peer-checked:text-green-700 peer-checked:border-green-500 dark:peer-checked:bg-green-900/30 dark:peer-checked:text-green-400 transition-all">Low</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="Medium" class="peer sr-only" checked>
                            <div class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 peer-checked:bg-blue-100 peer-checked:text-blue-700 peer-checked:border-blue-500 dark:peer-checked:bg-blue-900/30 dark:peer-checked:text-blue-400 transition-all">Medium</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="High" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 peer-checked:bg-orange-100 peer-checked:text-orange-700 peer-checked:border-orange-500 dark:peer-checked:bg-orange-900/30 dark:peer-checked:text-orange-400 transition-all">High</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="Critical" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 dark:border-gray-600 peer-checked:bg-red-100 peer-checked:text-red-700 peer-checked:border-red-500 dark:peer-checked:bg-red-900/30 dark:peer-checked:text-red-400 transition-all">Critical</div>
                        </label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes (Optional)</label>
                    <textarea id="taskNotesInput" rows="3" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" class="close-modal-btn px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-blue-600 rounded-lg shadow-md transition-colors">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-darkCard rounded-2xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform duration-300 text-center">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Are you sure?</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-6" id="confirmMessage">This action cannot be undone.</p>
            <div class="flex justify-center space-x-3">
                <button id="cancelConfirmBtn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                <button id="executeConfirmBtn" class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:bg-red-600 rounded-lg shadow-md transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Scripts -->
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
